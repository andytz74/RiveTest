<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rive Chat Helper - Overlay</title>
<script src="https://unpkg.com/@rive-app/canvas"></script>
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171d27;color:#f4f7ff}.app{width:min(860px,100%);min-height:100vh;margin:auto;padding:18px 16px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:20px}.status{color:#9aa9c7;font-size:12px}.switch{display:flex;gap:8px;margin-bottom:18px}.switch a{color:#b8c4e2;text-decoration:none;border:1px solid #313b50;border-radius:999px;padding:7px 11px;font-size:12px}.switch a.active{background:#303b57;color:#fff}.chat{position:relative;flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:24px;overflow:visible}.row{display:flex;width:100%;align-items:flex-start;overflow:visible}.assistant{display:grid;grid-template-columns:600px 160px;gap:12px;align-items:start;width:772px;max-width:100%;overflow:visible}.assistant .bubble{width:600px;max-width:100%;min-height:130px;background:#202737}.user{justify-content:flex-end;margin-left:auto;overflow:visible}.user .bubble{width:600px;max-width:100%;background:#202838}.bubble{border:1px solid #313b50;border-radius:16px;padding:15px 18px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}.label{color:#8da9ff;font-size:12px;font-weight:700;margin-bottom:8px}.rive-anchor{width:160px;height:160px}.rive-overlay{position:absolute;left:0;top:0;width:160px;height:160px;z-index:1000;pointer-events:none;transition:transform 500ms ease}.rive-overlay canvas{display:block;width:160px;height:160px}.dots{color:#9ca9c4;letter-spacing:3px}.composer{display:flex;gap:10px;padding:14px;border:1px solid #313b50;border-radius:14px;background:#202737}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:8px}button{border:0;border-radius:10px;padding:0 18px;background:#eef2ff;color:#202737;font-weight:700}button:disabled{opacity:.45}@media(max-width:800px){.assistant{grid-template-columns:minmax(0,1fr) 140px;width:100%}.assistant .bubble{width:auto}.rive-anchor{width:140px;height:140px}.rive-overlay{width:140px;height:140px}.rive-overlay canvas{width:140px;height:140px}.user .bubble{width:min(600px,86%)}}@media(max-width:620px){.app{padding:18px 12px}.assistant{grid-template-columns:minmax(0,1fr) 110px;gap:10px}.rive-anchor{width:110px;height:110px}.rive-overlay{width:110px;height:110px}.rive-overlay canvas{width:110px;height:110px}.user .bubble{width:86%}}</style>
</head>
<body>
<main class="app"><header><h1>Rive Chat Helper <span style="font-size:12px;color:#8da9ff">Overlay 시안</span></h1><div class="status" id="status">대기 중</div></header><nav class="switch"><a href="index.html">기본 시안</a><a class="active" href="overlay.html">오버레이 시안</a></nav><section class="chat" id="chat" aria-live="polite"><div class="row assistant" id="welcome"><div class="bubble"><div class="label">INSIGHT</div>무엇이든 질문해 보세요. 오버레이 방식으로 캐릭터가 채팅 위를 이동합니다.</div><div class="rive-anchor"></div></div></section><form class="composer" id="composer"><input id="input" autocomplete="off" placeholder="질문을 입력해 보세요..."><button id="send" type="submit">질문</button></form></main><div class="rive-overlay" id="riveBox"><canvas id="riveCanvas"></canvas></div>
<script>const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),status=document.getElementById("status"),riveBox=document.getElementById("riveBox");let riveFile=null,waiting=false,pendingQuestion="",pendingAnswerRow=null,pendingAnswerText="",answerIndex=0;const nl=String.fromCharCode(10);const answers=["짧은 한 줄 답변입니다.","첫 번째 줄 답변입니다."+nl+"두 번째 줄 답변입니다."+nl+"세 번째 줄 답변입니다.","첫 번째 줄 답변입니다."+nl+"두 번째 줄 답변입니다."+nl+"세 번째 줄 답변입니다."+nl+"네 번째 줄 답변입니다."+nl+"다섯 번째 줄 답변입니다."+nl+"여섯 번째 줄 답변입니다."];function setStatus(v){status.textContent=v}function fire(n){if(!riveFile)return;const i=riveFile.stateMachineInputs("State Machine 1").find(x=>x.name===n);if(i&&i.fire)i.fire()}function setTyping(v){if(!riveFile)return;const i=riveFile.stateMachineInputs("State Machine 1").find(x=>x.name==="isTyping");if(i)i.value=v}function moveRiveTo(row){const slot=row.querySelector(".rive-anchor");if(!slot)return;const c=chat.getBoundingClientRect(),r=slot.getBoundingClientRect();riveBox.style.transform="translate("+(r.left-c.left)+"px,"+(r.top-c.top)+"px)"}function addUser(t){const row=document.createElement("div");row.className="row user";const b=document.createElement("div");b.className="bubble";b.textContent=t;row.appendChild(b);chat.appendChild(row)}function addAnswer(){const row=document.createElement("div");row.className="row assistant";const b=document.createElement("div");b.className="bubble";b.innerHTML="<div class=\"label\">INSIGHT</div><div class=\"answer dots\">...</div>";const a=document.createElement("div");a.className="rive-anchor";row.append(b,a);chat.appendChild(row);moveRiveTo(row);row.scrollIntoView({behavior:"smooth",block:"nearest"});return row}function typeAnswer(row,text){const target=row.querySelector(".answer");target.classList.remove("dots");target.textContent="";let i=0;setStatus("답변 중");const timer=setInterval(()=>{target.textContent+=text[i++]||"";if(i>=text.length){clearInterval(timer);setStatus("답변 완료 대기");setTimeout(()=>{waiting=false;send.disabled=false;fire("doneAnswer");setStatus("대기 중");input.focus()},1000)}},36)}function handleRiveEvent(e){const d=e&&e.data||{},n=d.name||e&&e.name;if(n==="Event_Next"&&pendingQuestion){const q=pendingQuestion;pendingQuestion="";addUser(q);pendingAnswerRow=addAnswer();pendingAnswerText=answers[answerIndex++%answers.length];setStatus("답변 대기 중");setTimeout(()=>{fire("answerArrived");setStatus("답변 준비 중")},3000);return}if(n==="Event_StartAnswer"&&pendingAnswerRow){const row=pendingAnswerRow,text=pendingAnswerText;pendingAnswerRow=null;pendingAnswerText="";typeAnswer(row,text)}}function submit(){const v=input.value.trim();if(!v||waiting)return;waiting=true;send.disabled=true;pendingQuestion=v;input.value="";fire("inputQ");setStatus("질문 처리 중")}input.addEventListener("input",()=>{setTyping(input.value.length>0);setStatus(input.value?"주목 중":"대기 중")});input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});document.getElementById("composer").addEventListener("submit",e=>{e.preventDefault();submit()});window.addEventListener("resize",()=>{const row=pendingAnswerRow||chat.querySelector(".assistant:last-child");if(row)moveRiveTo(row)});riveFile=new rive.Rive({src:"chathelper.riv",canvas:document.getElementById("riveCanvas"),autoplay:true,artboard:"ChatHelper",stateMachines:"State Machine 1",fit:rive.Fit.Contain,alignment:rive.Alignment.BottomCenter,onLoad:()=>{riveFile.resizeDrawingSurfaceToCanvas();moveRiveTo(document.getElementById("welcome"));if(rive.EventType&&rive.EventType.RiveEvent)riveFile.on(rive.EventType.RiveEvent,handleRiveEvent)}});</script>
</body>
</html>
