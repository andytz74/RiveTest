<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rive Chat Helper - Overlay</title>
<script src="https://unpkg.com/@rive-app/canvas"></script>
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171d27;color:#f4f7ff}.app{width:min(860px,100%);min-height:100vh;margin:auto;padding:18px 16px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:20px}.status{color:#9aa9c7;font-size:12px}.switch{display:flex;gap:8px;margin-bottom:18px}.switch a{color:#b8c4e2;text-decoration:none;border:1px solid #313b50;border-radius:999px;padding:7px 11px;font-size:12px}.switch a.active{background:#303b57;color:#fff}.chat{position:relative;flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:24px;overflow:visible}.row{display:flex;width:100%;align-items:flex-start;overflow:visible}.assistant{display:grid;grid-template-columns:600px 192px;gap:12px;align-items:start;width:804px;max-width:100%;overflow:visible}.assistant .bubble{width:600px;max-width:100%;min-height:130px;background:#202737}.user{justify-content:flex-end;margin-left:auto;overflow:visible}.user .bubble{width:600px;max-width:100%;background:#202838}.bubble{border:1px solid #313b50;border-radius:16px;padding:15px 18px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}.label{color:#8da9ff;font-size:12px;font-weight:700;margin-bottom:8px}.rive-anchor{width:192px;height:192px}.rive-overlay{position:fixed;left:0;top:0;width:192px;height:192px;z-index:1000;pointer-events:auto;cursor:grab;touch-action:none;transition:transform 500ms ease}.rive-overlay.dragging{cursor:grabbing;transition:none}.rive-overlay canvas{display:block;width:192px;height:192px;pointer-events:none}.dots{color:#9ca9c4;letter-spacing:3px}.composer{display:flex;gap:10px;padding:14px;border:1px solid #313b50;border-radius:14px;background:#202737}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:8px}button{border:0;border-radius:10px;padding:0 18px;background:#eef2ff;color:#202737;font-weight:700}button:disabled{opacity:.45}.hint{font-size:11px;color:#7f8baa;margin-top:8px}@media(max-width:800px){.assistant{grid-template-columns:minmax(0,1fr) 168px;width:100%}.assistant .bubble{width:auto}.rive-anchor{width:168px;height:168px}.rive-overlay{width:168px;height:168px}.rive-overlay canvas{width:168px;height:168px}.user .bubble{width:min(600px,86%)}}@media(max-width:620px){.app{padding:18px 12px}.assistant{grid-template-columns:minmax(0,1fr) 132px;gap:10px}.rive-anchor{width:132px;height:132px}.rive-overlay{width:132px;height:132px}.rive-overlay canvas{width:132px;height:132px}.user .bubble{width:86%}}</style>
</head>
<body>
<main class="app"><header><h1>Rive Chat Helper <span style="font-size:12px;color:#8da9ff">Overlay 시안</span></h1><div class="status" id="status">대기 중</div></header><nav class="switch"><a href="index.html">기본 시안</a><a class="active" href="overlay.html">오버레이 시안</a></nav><section class="chat" id="chat" aria-live="polite"><div class="row assistant" id="welcome"><div class="bubble"><div class="label">INSIGHT</div>무엇이든 질문해 보세요. 캐릭터를 드래그해 채팅창에 놓으면 해당 창을 따라갑니다.</div><div class="rive-anchor"></div></div></section><div class="hint">캐릭터를 드래그하세요 · 시스템 채팅 위에 놓으면 고정 · 빈 공간에 놓으면 자유 위치</div><form class="composer" id="composer"><input id="input" autocomplete="off" placeholder="질문을 입력해 보세요..."><button id="send" type="submit">질문</button></form></main><div class="rive-overlay" id="riveBox"><canvas id="riveCanvas"></canvas></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),riveBox=document.getElementById('riveBox');let riveFile=null,waiting=false,pendingQuestion='',pendingAnswerRow=null,pendingAnswerText='',answerIndex=0,lockedRow=null,systemFollow=false,manualPosition=false,freePos={x:window.innerWidth-220,y:90},dragState=null;const nl=String.fromCharCode(10);const answers=['짧은 한 줄 답변입니다.','첫 번째 줄 답변입니다.'+nl+'두 번째 줄 답변입니다.'+nl+'세 번째 줄 답변입니다.','첫 번째 줄 답변입니다.'+nl+'두 번째 줄 답변입니다.'+nl+'세 번째 줄 답변입니다.'+nl+'네 번째 줄 답변입니다.'+nl+'다섯 번째 줄 답변입니다.'+nl+'여섯 번째 줄 답변입니다.'];function setStatus(v){status.textContent=v}function fire(n){if(!riveFile)return;const i=riveFile.stateMachineInputs('State Machine 1').find(x=>x.name===n);if(i&&i.fire)i.fire()}function setTyping(v){if(!riveFile)return;const i=riveFile.stateMachineInputs('State Machine 1').find(x=>x.name==='isTyping');if(i)i.value=v}function setRivePosition(x,y){freePos={x:Math.max(0,Math.min(x,window.innerWidth-riveBox.offsetWidth)),y:Math.max(0,Math.min(y,window.innerHeight-riveBox.offsetHeight))};riveBox.style.transform='translate('+freePos.x+'px,'+freePos.y+'px)'}function moveRiveTo(row){const slot=row&&row.querySelector('.rive-anchor');if(!slot)return;const r=slot.getBoundingClientRect();setRivePosition(r.left,r.top)}function followTarget(){if(manualPosition)return;if(systemFollow&&pendingAnswerRow)moveRiveTo(pendingAnswerRow);else if(lockedRow)moveRiveTo(lockedRow);else if(pendingAnswerRow)moveRiveTo(pendingAnswerRow);else{const row=chat.querySelector('.assistant:last-child');if(row)moveRiveTo(row)}}function addUser(t){const row=document.createElement('div');row.className='row user';const b=document.createElement('div');b.className='bubble';b.textContent=t;row.appendChild(b);chat.appendChild(row)}function addAnswer(){const row=document.createElement('div');row.className='row assistant';const b=document.createElement('div');b.className='bubble';b.innerHTML='<div class="label">INSIGHT</div><div class="answer dots">...</div>';const a=document.createElement('div');a.className='rive-anchor';row.append(b,a);chat.appendChild(row);if(systemFollow||(!lockedRow&&!manualPosition))moveRiveTo(row);row.scrollIntoView({behavior:'smooth',block:'nearest'});return row}function typeAnswer(row,text){const target=row.querySelector('.answer');target.classList.remove('dots');target.textContent='';let i=0;setStatus('답변 중');const timer=setInterval(()=>{target.textContent+=text[i++]||'';if(i>=text.length){clearInterval(timer);setStatus('답변 완료 대기');setTimeout(()=>{waiting=false;send.disabled=false;fire('doneAnswer');setStatus('대기 중');input.focus()},1000)}},36)}function handleRiveEvent(e){const d=e&&e.data||{},n=d.name||e&&e.name;if(n==='Event_Next'&&pendingQuestion){const q=pendingQuestion;pendingQuestion='';addUser(q);pendingAnswerRow=addAnswer();pendingAnswerText=answers[answerIndex++%answers.length];setStatus('답변 대기 중');setTimeout(()=>{fire('answerArrived');setStatus('답변 준비 중')},3000);return}if(n==='Event_StartAnswer'&&pendingAnswerRow){const row=pendingAnswerRow,text=pendingAnswerText;pendingAnswerRow=null;pendingAnswerText='';typeAnswer(row,text)}}function submit(){const v=input.value.trim();if(!v||waiting)return;waiting=true;send.disabled=true;pendingQuestion=v;input.value='';fire('inputQ');setStatus('질문 처리 중')}input.addEventListener('input',()=>{setTyping(input.value.length>0);setStatus(input.value?'주목 중':'대기 중')});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();submit()});riveBox.addEventListener('pointerdown',e=>{const r=riveBox.getBoundingClientRect();dragState={dx:e.clientX-r.left,dy:e.clientY-r.top};riveBox.classList.add('dragging');riveBox.setPointerCapture(e.pointerId)});riveBox.addEventListener('pointermove',e=>{if(dragState)setRivePosition(e.clientX-dragState.dx,e.clientY-dragState.dy)});riveBox.addEventListener('pointerup',e=>{if(!dragState)return;dragState=null;riveBox.classList.remove('dragging');const hit=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el!==riveBox&&el.closest&&el.closest('.assistant .bubble'));systemFollow=!!hit;lockedRow=null;manualPosition=!hit;followTarget()});riveBox.addEventListener('pointercancel',()=>{dragState=null;riveBox.classList.remove('dragging')});window.addEventListener('resize',followTarget);window.addEventListener('scroll',followTarget,{passive:true});setRivePosition(freePos.x,freePos.y);riveFile=new rive.Rive({src:'chathelper.riv',canvas:document.getElementById('riveCanvas'),autoplay:true,artboard:'ChatHelper',stateMachines:'State Machine 1',fit:rive.Fit.Contain,alignment:rive.Alignment.BottomCenter,onLoad:()=>{riveFile.resizeDrawingSurfaceToCanvas();moveRiveTo(document.getElementById('welcome'));if(rive.EventType&&rive.EventType.RiveEvent)riveFile.on(rive.EventType.RiveEvent,handleRiveEvent)}});
</script>
</body>
</html>
