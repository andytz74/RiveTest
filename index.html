<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rive Chat Helper</title><script src="https://unpkg.com/@rive-app/canvas"></script><style>:root{color-scheme:dark;font-family:Inter,Pretendard,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171d27;color:#f4f7ff}.app{width:min(1100px,100%);min-height:100vh;margin:auto;padding:28px 24px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;margin-bottom:24px}h1{margin:0;font-size:20px}.status{color:#9aa9c7;font-size:12px}.chat{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:24px}.row{display:flex;width:100%;gap:18px;align-items:flex-end}.user{justify-content:flex-end}.bubble{border:1px solid #313b50;border-radius:16px;padding:15px 18px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}.user .bubble{max-width:78%;background:#202838}.assistant .bubble{width:min(720px,calc(100% - 160px));background:#202737}.label{color:#8da9ff;font-size:12px;font-weight:700;margin-bottom:8px}.rive{flex:0 0 140px;width:140px;height:170px;overflow:hidden}.rive canvas{width:140px;height:170px}.dots{color:#9ca9c4;letter-spacing:3px}.composer{display:flex;gap:10px;padding:14px;border:1px solid #313b50;border-radius:14px;background:#202737}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:8px}button{border:0;border-radius:10px;padding:0 18px;background:#eef2ff;color:#202737;font-weight:700}button:disabled{opacity:.45}@media(max-width:680px){.app{padding:18px 14px}.assistant .bubble{width:calc(100% - 92px)}.rive{flex-basis:76px;width:76px;height:120px}.rive canvas{width:76px;height:120px}}</style></head><body><main class="app"><header><h1>Rive Chat Helper</h1><div class="status" id="status">대기 중</div></header><section class="chat" id="chat" aria-live="polite"><div class="row assistant"><div class="bubble"><div class="label">INSIGHT</div>무엇이든 질문해 보세요. 입력 중에는 캐릭터가 주목합니다.</div><div class="rive"><canvas id="rive-canvas"></canvas></div></div></section><form class="composer" id="composer"><input id="question" autocomplete="off" placeholder="질문을 입력하고 Enter를 눌러보세요"><button id="send" type="submit">질문</button></form></main><script>const input=document.getElementById('question'),chat=document.getElementById('chat'),status=document.getElementById('status'),send=document.getElementById('send');let riveFile,inputs=[],waiting=false;function setStatus(t){status.textContent=t}function getInput(n){return inputs.find(x=>x.name===n)}function typing(v){const x=getInput('isTyping');if(x)x.value=v}function fire(n){const x=getInput(n);if(x&&x.fire)x.fire()}riveFile=new rive.Rive({src:'chathelper.riv',canvas:document.getElementById('rive-canvas'),artboard:'ChatHelper',stateMachines:'State Machine 1',autoplay:true,fit:rive.Fit.Contain,alignment:rive.Alignment.BottomCenter,onLoad:()=>{riveFile.resizeDrawingSurfaceToCanvas();inputs=riveFile.stateMachineInputs('State Machine 1')||[]}});input.addEventListener('input',()=>{const v=input.value.trim().length>0;typing(v);if(!waiting)setStatus(v?'주목 중':'대기 중')});function addUser(t){const r=document.createElement('div');r.className='row user';r.innerHTML='<div class="bubble"></div>';r.querySelector('.bubble').textContent=t;chat.appendChild(r)}function addAnswer(){const r=document.createElement('div');r.className='row assistant';r.innerHTML='<div class="bubble"><div class="label">INSIGHT</div><span class="answer"><span class="dots">•••</span></span></div>';const riveEl=document.querySelector('.rive');if(riveEl)r.appendChild(riveEl);chat.appendChild(r);return r}function typeAnswer(row,text){const target=row.querySelector('.answer');let i=0;setStatus('답변 중');const timer=setInterval(()=>{target.textContent+=text[i++]||'';if(i>=text.length){clearInterval(timer);waiting=false;send.disabled=false;fire('DoneAnswer');setStatus('대기 중');input.focus()}},36)}document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();if(waiting)return;const q=input.value.trim();if(!q)return;waiting=true;send.disabled=true;fire('inputQ');setStatus('생각 중');addUser(q);const row=addAnswer();input.value='';setTimeout(()=>{typeAnswer(row,'질문을 확인했어요. Rive State Machine과 채팅 UI를 연결한 테스트 답변입니다.')},3000)})</script></body></html>
